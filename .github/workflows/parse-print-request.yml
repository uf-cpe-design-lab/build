name: Parse print request

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  parse-and-comment:
    if: contains(github.event.issue.labels.*.name, 'print-request')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install issue-parser
        run: npm install @github/issue-parser

      - name: Parse issue and Estimate
        uses: actions/github-script@v7
        with:
          script: |
            const { parseIssue } = require('@github/issue-parser');

            const body = context.payload.issue.body;
            const template = require('fs').readFileSync('.github/ISSUE_TEMPLATE/print-request.yml', 'utf8');

            const printRequest = parseIssue(body, template);

            console.log(JSON.stringify(parsed, null, 2)); 
            
            const modelUrl    = printRequest['model_url'];
            const material    = printRequest['material'];
            const layerHeight = printRequest['layer_height'];
            const infill      = printRequest['infill'];
            const supports    = printRequest['supports'];
            const quantity    = parseInt(printRequest['quantity']) || 1;
            const deadline    = printRequest['deadline'];
            const color       = printRequest['color'];
            const notes       = printRequest['notes'];
            const ack         = printRequest['ack'];

            const comment = `
            ##Print Request
            modelURL: $(modelURL)
            material: $(material)
            color: $(color)
            notes: $(notes) 
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
