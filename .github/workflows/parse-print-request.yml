name: Parse print request

on:
  issues:
    types: [opened, edited]

jobs:
  parse-and-comment:
    if: contains(github.event.issue.labels.*.name, 'print-request')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install issue-parser
        run: npm install @github/issue-parser

      - name: Parse issue and Estimate
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "This is a test, hello!"
            });
