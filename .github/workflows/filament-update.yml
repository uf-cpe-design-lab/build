name: Filament update 
on:
  push:
    branches:
      - main
    paths:
      - "3d-print/filament-list.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install ruamel.yaml

      - name: Sync options
        run: python 3d-print/sync_options.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_TEMPLATE/print-request.yml
          git diff --cached --quiet || git commit -m "chore: sync options from filament-list.yml"
          git push
